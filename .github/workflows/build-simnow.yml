name: Build SimNow Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'simnow/**'
  workflow_dispatch:  # 支持手动触发

env:
  DOCKER_IMAGE: simnow-trader
  DOCKER_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest  # x86_64 Linux 环境，vnpy-ctp 编译无问题
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 如果要推送到 Docker Hub，取消下面的注释并配置 Secrets
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./simnow
          file: ./simnow/Dockerfile
          # push: true  # 配置 Docker Hub 后取消注释
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} | gzip > simnow-trader.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: simnow-docker-image
          path: simnow-trader.tar.gz
          retention-days: 30

      - name: Test container startup
        run: |
          docker run --rm --name test-simnow \
            -e SIMNOW_USER=test \
            -e SIMNOW_PASS=test \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} \
            python -c "import vnpy; print('vnpy OK'); import vnpy_ctp; print('vnpy_ctp OK')"

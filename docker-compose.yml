services:
  quant:
    build: .
    container_name: quant-backtest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
    restart: unless-stopped
